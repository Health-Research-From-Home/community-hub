<!doctype html>
<html lang="en">
	<head>
		<!-- KEEP: Required browser and mobile settings. -->
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- CHANGE: Use a short, descriptive title for this page. -->
		<title>Page title</title>

		<!-- KEEP: Shared site styles, fonts, icons, and template loader. -->
		<link rel="stylesheet" href="style.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
		<script src="Templates/template-loader.js" defer></script>
	</head>

	<body>
		<!--
			CHANGE: Replace "Page heading" with the heading visitors should see.
			KEEP: Use variant="subpage" for normal pages.
			The homepage uses <site-header variant="home"></site-header> instead.
		-->
		<site-header variant="subpage" heading="Page heading"></site-header>

		<!-- KEEP: This provides a helpful message if JavaScript is disabled. -->
		<noscript><p class="javascript-notice">Please enable JavaScript to display the site navigation.</p></noscript>

		<!-- CHANGE: Add all content unique to this page inside <main>. -->
		<main>
			<section>
				<h2>Section heading</h2>
				<p>Add the page content here.</p>
			</section>
		</main>

		<!-- KEEP: The shared footer is loaded from Templates/footer.html. -->
		<site-footer></site-footer>
	</body>
</html>
