<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data, technology, methods </title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <script src="Templates/template-loader.js" defer></script>
</head>

<body>

    <site-header variant="subpage" heading="Data, technology, methods"></site-header>

    <noscript>
        <p class="javascript-notice">
            Please enable JavaScript to display the site navigation.
        </p>
    </noscript>

    <main>

        <div class="blog-post">

            <div class="blog-leftcolumn">

                <h2>Resources</h2>

                <p>Some example text here</p>

                <div class="dmt-buttons">

                    <a href="#" class="dmt-button">
                        <span>
                            <strong>Analysis code from PAPrKA</strong>
                        </span>
                        <span class="dmt-button-arrow">→</span>
                    </a>

                    <a href="#" class="dmt-button">
                        <span>
                            <strong>Technology directory</strong>
                        </span>
                        <span class="dmt-button-arrow">→</span>
                    </a>

                </div>

                <section class="resources-section">

                    <div class="resource-filter">

                        <button type="button" class="filter-toggle">
                            Filter by topic <span>▾</span>
                        </button>

                        <div class="filter-options">
                            <!-- JavaScript will add the keyword checkboxes here -->
                        </div>

                    </div>

                    <div class="resources-layout">

                        <div
                            class="resource-tabs"
                            role="tablist"
                            aria-label="Resources"
                        >

                            <button
                                class="resource-tab active"
                                data-resource="0"

                            ></button>

                                role="tab"

                            <button

                            <button

                            <button

                            <button
                                class="resource-tab"

                            <button

                            <button
                                class="resource-tab"
                                data-resource="10"

                                role="tab"
                            ></button>

                            <button
                                class="resource-tab"
                                data-resource="11"
                                type="button"
                                role="tab"
                            ></button>

                            <button
                                class="resource-tab"
                                data-resource="12"
                                type="button"
                                role="tab"
                            ></button>

                            <button
                                class="resource-tab"
                                data-resource="13"
                                type="button"

                            <button

                            <button

                                data-resource="15"

                        </div>

                        <div class="resource-card">

                            <a
                                id="resourceImageLink"
                                class="resource-image-link"
                                href="#"
                                target="_blank"
                                rel="noopener"
                            >
                                <img
                                    id="resourceImage"
                                    class="resource-image"
                                    src=""
                                    alt=""
                                >
                            </a>

                            <div class="resource-content">

                                <div
                                    id="resourceCategory"
                                    class="resource-category"
                                ></div>

                                <h2
                                    id="resourceTitle"
                                    class="resource-title"
                                ></h2>

                                <p
                                    id="resourceDescription"
                                    class="resource-description"
                                ></p>

                                <div
                                    id="resourceTags"
                                    class="resource-tags"
                                ></div>

                                <a
                                    id="resourceButton"
                                    class="resource-button"
                                    href="#"
                                    target="_blank"
                                    rel="noopener"
                                >
                                    VIEW RESOURCE
                                </a>

                            </div>

                        </div>

                    </div>

                </section>

            </div>

            <div class="blog-rightcolumn">
                <quick-nav></quick-nav>
            </div>

    <site-footer></site-footer>

    <script src="popoutscript.js"></script>
